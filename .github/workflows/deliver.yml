name: deliver
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/endocrinovet-aulas-divisao-43b6yv"]
    paths: [".github/deliver-trigger"]
permissions:
  contents: write
concurrency:
  group: deliver
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: assemble and publish to draft release
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch curso-delivery "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" delivery
          cd delivery
          shopt -s nullglob
          for f in *.partaa; do
            base="${f%.partaa}"
            cat "${base}".part* > "$base"
            rm -f "${base}".part*
          done
          sha256sum -c manifest.sha256
          # substitui a versao anterior: apaga drafts antigos com o mesmo nome
          for id in $(gh api "repos/${REPO}/releases" --paginate --jq '.[] | select(.name=="Curso Endocrinovet — Aulas Editadas") | .id' 2>/dev/null); do
            gh api -X DELETE "repos/${REPO}/releases/$id" || true
          done
          RID=$(gh api -X POST "repos/${REPO}/releases" \
            -f tag_name="curso-endocrinovet-aulas-v2" \
            -f name="Curso Endocrinovet — Aulas Editadas" \
            -f body="Aulas do Curso Endocrinovet — fragmentacao pura do video original (v2). Baixe cada arquivo e suba na pasta do modulo correspondente no Google Drive." \
            -F draft=true --jq .id)
          echo "RID=$RID"
          for f in *.mp4; do
            echo "upload: $f ($(stat -c%s "$f") bytes)"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: video/mp4" \
              -T "$f" \
              "https://uploads.github.com/repos/${REPO}/releases/${RID}/assets?name=${f}" -o /dev/null
          done
          git push origin --delete curso-delivery || true
          echo "DELIVER-DONE rid=$RID"
