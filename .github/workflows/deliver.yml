name: deliver
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/endocrinovet-aulas-divisao-43b6yv"]
    paths: [".github/deliver-trigger"]
permissions:
  contents: write
concurrency:
  group: deliver
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: assemble and publish to draft release
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch curso-delivery "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" delivery
          cd delivery
          # reassemble files that were split for transport
          shopt -s nullglob
          for f in *.partaa; do
            base="${f%.partaa}"
            cat "${base}".part* > "$base"
            rm -f "${base}".part*
          done
          sha256sum -c manifest.sha256
          # create or reuse the draft release
          RID=$(gh api "repos/${REPO}/releases" --paginate --jq '[.[] | select(.name=="Curso Endocrinovet — Aulas Editadas")][0].id' 2>/dev/null || true)
          if [ -z "$RID" ] || [ "$RID" = "null" ]; then
            RID=$(gh api -X POST "repos/${REPO}/releases" \
              -f tag_name="curso-endocrinovet-aulas" \
              -f name="Curso Endocrinovet — Aulas Editadas" \
              -f body="Aulas editadas do Curso Endocrinovet, uma por arquivo. Baixe cada uma e suba na sua pasta do Google Drive." \
              -F draft=true --jq .id)
          fi
          echo "RID=$RID"
          EXISTING=$(gh api "repos/${REPO}/releases/${RID}/assets" --paginate --jq '.[].name' 2>/dev/null || true)
          for f in *.mp4; do
            if echo "$EXISTING" | grep -qxF "$f"; then echo "skip (ja enviado): $f"; continue; fi
            echo "upload: $f ($(stat -c%s "$f") bytes)"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: video/mp4" \
              -T "$f" \
              "https://uploads.github.com/repos/${REPO}/releases/${RID}/assets?name=${f}" -o /dev/null
          done
          # cleanup: transport branch and the old source-relay releases
          git push origin --delete curso-delivery || true
          for id in $(gh api "repos/${REPO}/releases" --paginate --jq '.[] | select(.tag_name|startswith("relay-")) | .id' 2>/dev/null); do
            gh api -X DELETE "repos/${REPO}/releases/$id" || true
          done
          echo "DELIVER-DONE rid=$RID"
